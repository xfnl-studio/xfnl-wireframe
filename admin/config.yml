# Sveltia CMS for xfnl.studio. Hosted on Vercel, so sign-in uses our own GitHub OAuth routes (api/auth.js and api/callback.js), not Netlify.
backend:
  name: github
  repo: xfnl-studio/xfnl-wireframe
  branch: main
  base_url: https://xfnl.studio
  auth_endpoint: api/auth

site_url: https://xfnl.studio
display_url: https://xfnl.studio
media_folder: img
public_folder: /img
locale: en

collections:
  - name: content
    label: Site content
    editor:
      preview: false
    files:
      - name: content
        label: All content
        file: content.json
        format: json
        fields:
          - name: site
            label: "Site"
            widget: object
            collapsed: true
            fields:
              - {name: brand_text, label: "Brand text", widget: string, required: false}
              - {name: email, label: "Email", widget: string, required: false}
              - {name: linkedin, label: "Linkedin", widget: string, required: false}
              - {name: copyright, label: "Copyright", widget: string, required: false}
          - name: home
            label: "Home"
            widget: object
            collapsed: true
            fields:
              - {name: eyebrow, label: "Eyebrow", widget: string, required: false}
              - {name: title, label: "Title", widget: string, required: false}
              - {name: title_html, label: "Title html", widget: text, required: false}
              - {name: lead_html, label: "Lead html", widget: text, required: false}
              - {name: cta_primary, label: "Cta primary", widget: string, required: false}
              - {name: cta_secondary, label: "Cta secondary", widget: string, required: false}
              - name: results
                label: "Results"
                widget: list
                collapsed: true
                summary: "{{fields.metric}}"
                fields:
                  - {name: metric, label: "Metric", widget: string, required: false}
                  - {name: detail, label: "Detail", widget: text, required: false}
              - name: featured_systems
                label: "Featured systems"
                widget: list
                collapsed: true
                summary: "{{fields.tag}}"
                fields:
                  - {name: tag, label: "Tag", widget: string, required: false}
                  - {name: title, label: "Title", widget: string, required: false}
                  - {name: subtitle, label: "Subtitle", widget: string, required: false}
                  - {name: href, label: "Href", widget: string, required: false}
              - name: experiments
                label: "Experiments"
                widget: list
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - {name: name, label: "Name", widget: string, required: false}
                  - {name: badge, label: "Badge", widget: string, required: false}
                  - {name: description, label: "Description", widget: text, required: false}
                  - {name: href, label: "Href", widget: string, required: false}
          - name: systems_page
            label: "Systems page"
            widget: object
            collapsed: true
            fields:
              - {name: eyebrow, label: "Eyebrow", widget: string, required: false}
              - {name: title_html, label: "Title html", widget: text, required: false}
              - {name: lead, label: "Lead", widget: text, required: false}
              - name: cases
                label: "Cases"
                widget: list
                collapsed: true
                summary: "{{fields.id}}"
                fields:
                  - {name: id, label: "Id", widget: string, required: false}
                  - name: meta
                    label: "Meta"
                    widget: list
                    field: {name: item, label: Item, widget: string}
                  - {name: title, label: "Title", widget: string, required: false}
                  - {name: p1_html, label: "P1 html", widget: text, required: false}
                  - {name: p2_html, label: "P2 html", widget: text, required: false}
                  - name: pills
                    label: "Pills"
                    widget: list
                    field: {name: item, label: Item, widget: string}
          - name: experiments_page
            label: "Experiments page"
            widget: object
            collapsed: true
            fields:
              - {name: eyebrow, label: "Eyebrow", widget: string, required: false}
              - {name: title_html, label: "Title html", widget: text, required: false}
              - {name: lead, label: "Lead", widget: text, required: false}
              - name: items
                label: "Items"
                widget: list
                allow_add: false
                field: {name: item, label: Item, widget: string, required: false}
          - name: about_page
            label: "About page"
            widget: object
            collapsed: true
            fields:
              - {name: eyebrow, label: "Eyebrow", widget: string, required: false}
              - {name: title_html, label: "Title html", widget: text, required: false}
              - {name: lead, label: "Lead", widget: text, required: false}
              - name: roles
                label: "Roles"
                widget: list
                collapsed: true
                summary: "{{fields.dates}}"
                fields:
                  - {name: dates, label: "Dates", widget: string, required: false}
                  - {name: company, label: "Company", widget: string, required: false}
                  - {name: role, label: "Role", widget: text, required: false}
                  - {name: location, label: "Location", widget: string, required: false}
          - name: copy
            label: "All page copy (every line of text)"
            widget: object
            collapsed: true
            fields:
              - name: site
                label: "Site wide (footer)"
                widget: list
                collapsed: true
                summary: "{{fields.where}}: {{fields.text}}"
                fields:
                  - {name: id, label: ID, widget: hidden}
                  - {name: where, label: Where it appears, widget: string, required: false, hint: "Don't edit. Shows where this text lives."}
                  - {name: text, label: Text, widget: text, hint: "Simple tags like strong, em, and a are allowed. Keep any tags you see."}
              - name: home
                label: "Home page"
                widget: list
                collapsed: true
                summary: "{{fields.where}}: {{fields.text}}"
                fields:
                  - {name: id, label: ID, widget: hidden}
                  - {name: where, label: Where it appears, widget: string, required: false, hint: "Don't edit. Shows where this text lives."}
                  - {name: text, label: Text, widget: text, hint: "Simple tags like strong, em, and a are allowed. Keep any tags you see."}
              - name: about
                label: "About page"
                widget: list
                collapsed: true
                summary: "{{fields.where}}: {{fields.text}}"
                fields:
                  - {name: id, label: ID, widget: hidden}
                  - {name: where, label: Where it appears, widget: string, required: false, hint: "Don't edit. Shows where this text lives."}
                  - {name: text, label: Text, widget: text, hint: "Simple tags like strong, em, and a are allowed. Keep any tags you see."}
              - name: work
                label: "Work page"
                widget: list
                collapsed: true
                summary: "{{fields.where}}: {{fields.text}}"
                fields:
                  - {name: id, label: ID, widget: hidden}
                  - {name: where, label: Where it appears, widget: string, required: false, hint: "Don't edit. Shows where this text lives."}
                  - {name: text, label: Text, widget: text, hint: "Simple tags like strong, em, and a are allowed. Keep any tags you see."}
              - name: systems
                label: "Systems page"
                widget: list
                collapsed: true
                summary: "{{fields.where}}: {{fields.text}}"
                fields:
                  - {name: id, label: ID, widget: hidden}
                  - {name: where, label: Where it appears, widget: string, required: false, hint: "Don't edit. Shows where this text lives."}
                  - {name: text, label: Text, widget: text, hint: "Simple tags like strong, em, and a are allowed. Keep any tags you see."}
              - name: experiments
                label: "Experiments page"
                widget: list
                collapsed: true
                summary: "{{fields.where}}: {{fields.text}}"
                fields:
                  - {name: id, label: ID, widget: hidden}
                  - {name: where, label: Where it appears, widget: string, required: false, hint: "Don't edit. Shows where this text lives."}
                  - {name: text, label: Text, widget: text, hint: "Simple tags like strong, em, and a are allowed. Keep any tags you see."}
